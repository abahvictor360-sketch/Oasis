name: iOS build

on:
  push:
    branches: [main, "ccr-*"]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift packages
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project LinphoneApp.xcodeproj -scheme Linphone

      # Unsigned build: proves the project compiles. Signing and TestFlight
      # upload need your Apple Developer account (add later).
      - name: Build (no code signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project LinphoneApp.xcodeproj \
            -scheme Linphone \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | tail -n 60

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log
